<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>業務日誌 入力補助</title>
  <style>
    :root { --bg: #ffffff; --fg: #1b1b1b; --accent: #1f4e79; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #eeeeee; --accent: #8cb8e0; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; line-height: 1.7; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    h1 { color: var(--accent); font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>業務日誌 入力補助（Outlook アドイン）</h1>
    <p>瀬野川・船越地域包括支援センターの業務日誌の自動記入に合わせて、Outlook の予定の件名と本文を入力するためのアドインです。</p>
    <p>使い方は、職員向けマニュアル「業務日誌の自動記入」を見てください。問い合わせは地域包括支援センターの管理者まで。</p>
  </main>
</body>
</html>
